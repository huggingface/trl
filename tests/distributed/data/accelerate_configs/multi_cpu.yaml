# Minimal two-process CPU (gloo) config, mirroring the `MULTI_GPU`/`FSDP` configs in this directory.
#
# `accelerate launch --config_file` cannot actually start two processes from this config in an environment without
# MPI: the CLI's `launch_command` only special-cases `MULTI_GPU`/`FSDP`/`DEEPSPEED`/`MEGATRON_LM`/`XLA` distributed
# types for a non-MPI multi-process spawn (`accelerate/commands/launch.py::launch_command`); `MULTI_CPU` falls
# through to `simple_launcher`, which starts a *single* subprocess unless `--mpirun_hostfile` is given, and that
# needs an `mpirun`/`mpiexec` binary. `tests/distributed/test_distillation_trainer_multi_teacher.py` therefore reads
# this file's values and reproduces them by launching with `torch.distributed.run` instead (the same mechanism
# `accelerate launch --multi_gpu` itself calls internally), with `ACCELERATE_USE_CPU` set from `use_cpu` below so
# `Accelerator()` still resolves to `MULTI_CPU`/gloo. This file stays the source of truth for the values, and is
# usable as-is with `accelerate launch --config_file` on a host that has MPI.
distributed_type: MULTI_CPU
num_processes: 2
use_cpu: true
mixed_precision: 'no'
