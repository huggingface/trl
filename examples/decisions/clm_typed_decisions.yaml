model_name_or_path: HuggingFaceTB/SmolLM2-135M
dataset_name: LocalLLaMA/typed-decisions
dataset_config: all
output_dir: output/clm-typed-decisions
dtype: float32
freeze_encoder: true
head_width: 1536
head_depth: 3
projection_dim: 512
max_length: 2047
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 1
num_train_epochs: 20
learning_rate: 0.0005
optim: adamw_torch
weight_decay: 0.0
max_grad_norm: 1.0
gradient_checkpointing: false
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 1
load_best_model_at_end: true
metric_for_best_model: accuracy
greater_is_better: true
bf16: true
attn_implementation: sdpa
seed: 1234
report_to: none
project: clm-typed-decisions
trackio_static_space_id: false
