model_name_or_path: Qwen/Qwen3-0.6B
dataset_name: PolyAI/banking77
output_dir: output/jeva-banking77
dtype: float32
mode: lora
use_peft: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - v_proj
projection_dim: 128
num_options: 8
null_fraction: 0.2
max_state_length: 128
max_option_length: 32
option_chunk_size: 16
per_device_train_batch_size: 2
per_device_eval_batch_size: 8
gradient_accumulation_steps: 2
max_steps: 1000
learning_rate: 0.0001
lr_scheduler_type: constant
logging_steps: 10
eval_strategy: steps
eval_steps: 200
save_strategy: steps
save_steps: 200
save_total_limit: 1
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
bf16: true
attn_implementation: sdpa
seed: 42
report_to: none
project: jeva-banking77
trackio_static_space_id: false
