# W2 agentic (TermGrade + terminus-2 on local Apptainer boxes), size M, shared arm (SHARED_W2 rev. 0), verl v0.9.1.
# The W1-M shared config with only what W2 changes: the data (one row per task), the agent loop
# (configs/verl/w2_agent_loop.py, registered by w2_agent_loop.yaml), batch shape (8 tasks x 8 episodes), lengths
# (65,536 per sequence), and checkpoints every 20. Launch: launch/verl/w2.sbatch. Mapping notes: envs/verl/NOTES.md "W2".
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  # written by the launcher from the Harbor split (python configs/verl/w2_agent_loop.py data ...)
  train_files: null
  val_files: null
  prompt_key: prompt
  return_raw_chat: true
  # V1 separate_async invariant: train_batch_size = parameter_sync_step x ppo_mini_batch_size (prompts).
  train_batch_size: 8
  gen_batch_size: 1
  # The dataset prompt is only the task instruction (terminus-2 builds the real prompt); an episode's sequence is at
  # most 65,536 tokens (the model length of every call), so prompt + response budgets add up to it.
  max_prompt_length: 8192
  max_response_length: 57344
  filter_overlong_prompts: true
  truncation: error
  apply_chat_template_kwargs:
    enable_thinking: false
  shuffle: true
  seed: 42

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  use_kl_in_reward: false
  rollout_correction:
    bypass_mode: true

actor_rollout_ref:
  hybrid_engine: false
  model:
    path: Qwen/Qwen3.5-9B
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp2
    optim:
      lr: 1.0e-6
      lr_warmup_steps: 0
      lr_scheduler_type: constant
      weight_decay: 0.0
      betas: [0.9, 0.999]
      clip_grad: 1.0
    grad_clip: 1.0
    ppo_mini_batch_size: 8
    ppo_epochs: 1
    use_dynamic_bsz: true
    # one whole episode (<= 65,536 tokens) must fit a micro-batch
    ppo_max_token_len_per_gpu: 65536
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    entropy_coeff: 0
    use_kl_loss: false
    checkpoint:
      save_contents: [model, optimizer, extra, hf_model]
  rollout:
    name: vllm
    mode: async
    nnodes: 1
    n_gpus_per_node: 4
    tensor_model_parallel_size: 1
    max_model_len: 65536
    gpu_memory_utilization: 0.85
    n: 8
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 65536
    checkpoint_engine:
      backend: nccl
    agent:
      default_agent_loop: harbor
      agent_loop_config_path: /fsx/amine_dirhoussi/trl-wt-stable-bench/experiments/asyncgrpo_stable_bench/configs/verl/w2_agent_loop.yaml

trainer:
  use_v1: true
  v1:
    trainer_mode: separate_async
    separate_async:
      num_warmup_batches: 1
      parameter_sync_step: 1
    sampler:
      max_off_policy_threshold: 8
      max_off_policy_strategy: drop
  nnodes: 1
  n_gpus_per_node: 4
  total_epochs: 100
  total_training_steps: 60
  save_freq: 20
  test_freq: -1
  val_before_train: false
  logger: [console, file]
  project_name: asyncgrpo-stable-bench

transfer_queue:
  enable: true
