# W1 math, size S, shared arm (SHARED_W1 rev. 2), verl v0.9.1. Mapping to configs/SHARED_W1.md is in EQUIVALENCE.md.
# Launch: python -m verl.trainer.main_ppo --config-path=<this dir> --config-name=w1-S (see launch/verl/w1.sbatch).
# Paths that depend on the run (data dir, checkpoint dir, experiment name) are passed on the command line.
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: /fsx/amine_dirhoussi/stable-bench-runs/verl/data/w1/train.parquet
  val_files: /fsx/amine_dirhoussi/stable-bench-runs/verl/data/w1/val.parquet
  prompt_key: prompt
  return_raw_chat: true
  # V1 separate_async invariant: train_batch_size = parameter_sync_step x ppo_mini_batch_size (prompts).
  train_batch_size: 32
  gen_batch_size: 1
  max_prompt_length: 2048
  max_response_length: 16384
  filter_overlong_prompts: true
  truncation: error
  # Passed to tokenizer.apply_chat_template both by the dataset (length filter) and by the agent loop that renders the
  # prompt sent to vLLM (verl/experimental/agent_loop/agent_loop.py:242-251). rev. 2: thinking off, set explicitly.
  apply_chat_template_kwargs:
    enable_thinking: false
  # train.parquet is already deduplicated and shuffled with seed 42 by workloads/math/prepare.py: keep that order.
  shuffle: false

reward:
  custom_reward_function:
    path: /fsx/amine_dirhoussi/trl-wt-stable-bench/experiments/asyncgrpo_stable_bench/configs/verl/w1_reward.py
    name: compute_score

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: false
  use_kl_in_reward: false
  rollout_correction:
    # PPO ratio is taken against the vLLM logprobs (no trainer recompute of old logprobs); verl's async default.
    bypass_mode: true

actor_rollout_ref:
  # Trainer GPUs never host a vLLM engine: 4 standalone rollout GPUs + 4 FSDP2 trainer GPUs.
  hybrid_engine: false
  model:
    path: Qwen/Qwen3.5-2B
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp2
    optim:
      lr: 1.0e-6
      lr_warmup_steps: 0
      lr_scheduler_type: constant
      weight_decay: 0.0
      betas: [0.9, 0.999]
      clip_grad: 1.0
    grad_clip: 1.0
    ppo_mini_batch_size: 32
    ppo_epochs: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 36864
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    entropy_coeff: 0
    use_kl_loss: false
    checkpoint:
      save_contents: [model, optimizer, extra, hf_model]
  rollout:
    name: vllm
    mode: async
    nnodes: 1
    n_gpus_per_node: 4
    tensor_model_parallel_size: 1
    # prompt 2048 + completion 16384 (rev. 2)
    max_model_len: 18432
    gpu_memory_utilization: 0.85
    n: 8
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 36864
    checkpoint_engine:
      backend: nccl

trainer:
  use_v1: true
  v1:
    trainer_mode: separate_async
    separate_async:
      num_warmup_batches: 1
      parameter_sync_step: 1
    sampler:
      max_off_policy_threshold: 8
      max_off_policy_strategy: drop
  nnodes: 1
  n_gpus_per_node: 4
  total_epochs: 1
  total_training_steps: 200
  save_freq: 50
  test_freq: -1
  val_before_train: false
  logger: [console, file]
  project_name: asyncgrpo-stable-bench

transfer_queue:
  enable: true
