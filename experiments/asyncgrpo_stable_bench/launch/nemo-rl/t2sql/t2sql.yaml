# NeMo-RL v0.8.0 on text-to-SQL, Qwen3.5-35B-A3B, one 8xB200 node.
# Base: NeMo-RL's long-run-validated Qwen3.5-35B-A3B recipe (docs/guides/models/qwen/qwen3-5.md, "100-Step Long-Run
# Results"): grpo-qwen3.5-35ba3b-dapo-4n8g-automodel-ep32.yaml (Automodel backend, full fine-tune, EP, sdpa attention,
# colocated vLLM TP8, synchronous GRPO, no KL, TIS, clip 0.2/0.28, lr 1e-6 with 10 warmup steps).
# Changed, and only these: one node (EP 32 -> 8); our model (the post-trained Qwen3.5-35B-A3B that TRL trains, not
# -Base); the workload (episode lengths, 6 turns, 64 x 16 per step, 100 steps, our env and data, no validation);
# the recipe's DAPO-math reward scaling and overlong shaping are off (our reward is already -1..1 with its own
# length handling); checkpoints every 20 steps, all kept.
# Retry after nemo-rl-001 (full fine-tune OOM on the first train step at 29.7k tokens, job 373838), built-in options only:
# - LoRA on Automodel (automodel_cfg.lora_cfg) with TRL's setup: r32 / alpha 64 on attention q/k/v/o, GDN
#   in_proj_qkv/z/b/a + out_proj and the shared expert gate/up/down (routed experts and router frozen), lr 5e-5,
#   Adam beta2 0.95, 10 warmup steps then cosine to 10% (TRL run 373132);
# - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True for the policy workers, as the shipped
#   grpo-qwen3.5-35ba3b-2n8g-automodel-ep16 recipe sets (43.6 GiB was reserved-but-unallocated at the OOM).
# The recipe's logprob_chunk_size 4096 stays; it does not reach the train-loss log_softmax on this path (no TP/CP).
defaults: /opt/nemo-rl/examples/configs/recipes/llm/grpo-qwen3.5-35ba3b-dapo-4n8g-automodel-ep32.yaml
grpo:
  num_prompts_per_step: 64
  num_generations_per_prompt: 16
  max_rollout_turns: 6          # 5 SQL tool turns + 1 answer turn
  max_num_steps: 100
  max_num_epochs: 100
  val_period: 0
  val_at_start: false
  val_at_end: false
  reward_scaling:
    enabled: false
  reward_shaping:
    enabled: false
checkpointing:
  enabled: true
  checkpoint_dir: ${oc.env:RUN_DIR}/checkpoints
  metric_name: null
  keep_top_k: null
  save_period: 20
  save_optimizer: false
policy:
  model_name: Qwen/Qwen3.5-35B-A3B
  train_global_batch_size: 1024  # one optimizer step per GRPO step, as the recipe (batch = prompts x generations)
  max_total_sequence_length: 29696  # t2sql_episode MAX_SEQ_LEN
  automodel_cfg:
    expert_parallel_size: 8
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    lora_cfg:
      enabled: true
      dim: 32
      alpha: 64
      match_all_linear: false
      target_modules: ["*language_model*.q_proj", "*language_model*.k_proj", "*language_model*.v_proj",
                       "*language_model*.o_proj", "*language_model*.in_proj_qkv", "*language_model*.in_proj_z",
                       "*language_model*.in_proj_b", "*language_model*.in_proj_a", "*language_model*.out_proj",
                       "*language_model*.gate_proj", "*language_model*.up_proj", "*language_model*.down_proj"]
      use_triton: false
    checkpoint:
      save_consolidated: "every"   # HF safetensors (<ckpt>/policy/weights/model/consolidated) for the shared vLLM eval
  optimizer:
    kwargs:
      lr: 5.0e-05
      betas: [0.9, 0.95]
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 1.0e-08
      end_factor: 1.0
      total_iters: 10
  - name: torch.optim.lr_scheduler.CosineAnnealingLR
    kwargs:
      T_max: 90
      eta_min: 5.0e-06
  - milestones:
    - 10
  generation:
    max_new_tokens: 3072        # t2sql_episode MAX_TOKENS_PER_TURN; NeMo-RL clamps to max_model_len - input
data:
  max_input_seq_length: 29696
  shuffle: true
logger:
  log_dir: ${oc.env:RUN_DIR}/logs
  wandb_enabled: false
  tensorboard_enabled: true
  monitor_gpus: true
cluster:
  gpus_per_node: 8
  num_nodes: 1
