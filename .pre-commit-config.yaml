repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff-check
        types_or: [ python, pyi ]
        args: [ --fix ]
      - id: ruff-format
        types_or: [ python, pyi ]

  - repo: https://github.com/huggingface/doc-builder
    rev: c2d27f6f231df3d1b07f3a7ea54fe3d0f8bc3e27  # main
    hooks:
      - id: doc-builder-style
        args: [--max_len, "119"]
        files: ^(trl|tests|docs/source)/
