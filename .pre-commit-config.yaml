repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff-check
        types_or: [ python, pyi ]
        args: [ --fix ]
      - id: ruff-format
        types_or: [ python, pyi ]

  - repo: https://github.com/huggingface/doc-builder
    rev: 1b16dac5e33043af565fdf4c1b5b0fe81d0891c8  # main
    hooks:
      - id: doc-builder-style
        args: [--max_len, "119"]
        files: ^(trl|tests|docs/source)/
