version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Actions pinned inside our local composite actions. The "/" directory above
  # does not cover them: it only scans .github/workflows and the root action.yml.
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      local-actions:
        patterns: ["*"]

  # Not grouped, so that a ruff bump, which reformats code, stays separate from a doc-builder bump
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
