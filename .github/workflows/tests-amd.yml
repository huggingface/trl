name: Tests (AMD)

on:
  push:
    branches:
      - main
      - ci-*
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests-amd.yml"
      - ".github/actions/**"
      - "Makefile"
      - "examples/**.py"
      - "tests/**"
      - "trl/**"
      - "pyproject.toml"
      # Exclude if only experimental code/tests
      - "!trl/experimental/**"
      - "!tests/experimental/**"
  pull_request:
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests-amd.yml"
      - ".github/actions/**"
      - "Makefile"
      - "examples/**.py"
      - "tests/**"
      - "trl/**"
      - "pyproject.toml"
      # Exclude if only experimental code/tests
      - "!trl/experimental/**"
      - "!tests/experimental/**"
  workflow_dispatch:

env:
  TQDM_DISABLE: 1
  CI_SLACK_CHANNEL: ${{ secrets.CI_PUSH_MAIN_CHANNEL }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTORCH_ALLOC_CONF: "expandable_segments:True"
  # Install into the image's ROCm Python instead of creating a venv with CUDA torch.
  PIP_BREAK_SYSTEM_PACKAGES: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    permissions:
      contents: read
    name: Tests on AMD
    runs-on:
      group: hfc-amd-mi300-1gpu
    container:
      image: rocm/pytorch:rocm10.1.0_ubuntu26.04_py3.14_pytorch_release_2.14.0
      # Forward HIP_VISIBLE_DEVICES and ROCR_VISIBLE_DEVICES assigned by the runner,
      # matching transformers' AMD CI. Do not override these with CUDA_VISIBLE_DEVICES.
      options: --device /dev/kfd --device /dev/dri --group-add video --env-file /etc/podinfo/gha-gpu-isolation-settings --ipc=host --shm-size "16gb"
    defaults:
      run:
        shell: bash
    if: github.event.pull_request.draft == false
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Keep the image's ROCm torch stack when resolving optional dependencies.
          python3 -m pip freeze | grep -Ei '^(torch|torchvision|torchaudio|triton|triton-rocm|pytorch-triton-rocm)==' > /tmp/rocm-constraints.txt
          python3 -m pip install -c /tmp/rocm-constraints.txt ".[dev]"

      - name: Verify ROCm and GPU isolation
        run: |
          python3 - <<'PY'
          import torch

          assert torch.version.hip, "CUDA torch got installed"
          assert torch.cuda.is_available(), "ROCm GPU is unavailable"
          # ROCm may report zero devices before HIP is initialized.
          torch.cuda.init()
          assert torch.cuda.device_count() == 1, "Unexpected GPU isolation"
          print("ROCm torch", torch.__version__, "| HIP", torch.version.hip)
          for i in range(torch.cuda.device_count()):
              print(i, torch.cuda.get_device_name(i))
          # Check ROCm Triton still works after installing optional dependencies.
          x = torch.arange(16, device="cuda", dtype=torch.float32)
          torch.testing.assert_close(torch.compile(lambda x: x + 1, fullgraph=True)(x), x + 1)
          print("ROCm Triton compilation passed")
          PY

      - name: Test with pytest
        run: |
          make test

      - name: Post to Slack
        if: github.ref == 'refs/heads/main' && !cancelled()  # Check if the branch is main
        uses: ./.github/actions/post-slack
        with:
          slack_channel: ${{ env.CI_SLACK_CHANNEL }}
          title: Tests on AMD
          slack_token: ${{ secrets.SLACK_CIFEEDBACK_BOT_TOKEN }}

  distributed:
    permissions:
      contents: read
    name: Distributed tests on AMD
    runs-on:
      group: hfc-amd-mi300-2gpu
    container:
      image: rocm/pytorch:rocm10.1.0_ubuntu26.04_py3.14_pytorch_release_2.14.0
      # Forward HIP_VISIBLE_DEVICES and ROCR_VISIBLE_DEVICES assigned by the runner,
      # matching transformers' AMD CI. Do not override these with CUDA_VISIBLE_DEVICES.
      options: --device /dev/kfd --device /dev/dri --group-add video --env-file /etc/podinfo/gha-gpu-isolation-settings --ipc=host --shm-size "16gb"
    defaults:
      run:
        shell: bash
    if: github.event.pull_request.draft == false
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          # Keep the image's ROCm torch stack when resolving optional dependencies.
          python3 -m pip freeze | grep -Ei '^(torch|torchvision|torchaudio|triton|triton-rocm|pytorch-triton-rocm)==' > /tmp/rocm-constraints.txt
          python3 -m pip install -c /tmp/rocm-constraints.txt ".[dev]"

      - name: Verify ROCm and GPU isolation
        run: |
          python3 - <<'PY'
          import torch

          assert torch.version.hip, "CUDA torch got installed"
          assert torch.cuda.is_available(), "ROCm GPU is unavailable"
          # ROCm may report zero devices before HIP is initialized.
          torch.cuda.init()
          assert torch.cuda.device_count() == 2, "Unexpected GPU isolation"
          print("ROCm torch", torch.__version__, "| HIP", torch.version.hip)
          for i in range(torch.cuda.device_count()):
              print(i, torch.cuda.get_device_name(i))
          # Check ROCm Triton still works after installing optional dependencies.
          x = torch.arange(16, device="cuda", dtype=torch.float32)
          torch.testing.assert_close(torch.compile(lambda x: x + 1, fullgraph=True)(x), x + 1)
          print("ROCm Triton compilation passed")
          PY

      - name: Run distributed tests
        run: |
          pytest -v tests/distributed/test_distributed.py

      - name: Post to Slack
        if: github.ref == 'refs/heads/main' && !cancelled()  # Check if the branch is main
        uses: ./.github/actions/post-slack
        with:
          slack_channel: ${{ env.CI_SLACK_CHANNEL }}
          title: Distributed tests on AMD
          slack_token: ${{ secrets.SLACK_CIFEEDBACK_BOT_TOKEN }}
