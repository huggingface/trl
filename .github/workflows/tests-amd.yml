name: Tests (AMD)

on:
  push:
    branches:
      - main
      - ci-*
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests-amd.yml"
      - ".github/actions/**"
      - "Makefile"
      - "examples/**.py"
      - "tests/**"
      - "trl/**"
      - "pyproject.toml"
      # Exclude if only experimental code/tests
      - "!trl/experimental/**"
      - "!tests/experimental/**"
  pull_request:
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests-amd.yml"
      - ".github/actions/**"
      - "Makefile"
      - "examples/**.py"
      - "tests/**"
      - "trl/**"
      - "pyproject.toml"
      # Exclude if only experimental code/tests
      - "!trl/experimental/**"
      - "!tests/experimental/**"
  workflow_dispatch:

env:
  TQDM_DISABLE: 1
  CI_SLACK_CHANNEL: ${{ secrets.CI_PUSH_MAIN_CHANNEL }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTORCH_ALLOC_CONF: "expandable_segments:True"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    permissions:
      contents: read
    name: Tests on AMD
    runs-on:
      group: hfc-amd-mi300-1gpu
    container:
      image: rocm/dev-ubuntu-24.04:7.2.4
      # The runner assigns the GPUs through HIP_VISIBLE_DEVICES and ROCR_VISIBLE_DEVICES in its env file
      options: --device /dev/kfd --device /dev/dri --group-add video --env-file /etc/podinfo/gha-gpu-isolation-settings --ipc=host
    defaults:
      run:
        shell: bash
    if: github.event.pull_request.draft == false
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Create Python virtual environment
        run: |
          uv venv
          uv pip install --upgrade setuptools wheel

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/rocm7.2
          uv pip install ".[dev]"

      - name: Check the ROCm build of torch
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import torch

          assert torch.version.hip, "CUDA torch got installed"
          # ROCm may report zero devices before HIP is initialized
          torch.cuda.init()
          assert torch.cuda.device_count() == 1, "Unexpected GPU isolation"
          # A dependency requiring `triton` installs the CUDA build over ROCm's `pytorch-triton-rocm`
          x = torch.arange(16, device="cuda", dtype=torch.float32)
          torch.testing.assert_close(torch.compile(lambda x: x + 1, fullgraph=True)(x), x + 1)
          PY

      - name: Test with pytest
        run: |
          source .venv/bin/activate
          make test

      - name: Post to Slack
        if: github.ref == 'refs/heads/main' && !cancelled()  # Check if the branch is main
        uses: ./.github/actions/post-slack
        with:
          slack_channel: ${{ env.CI_SLACK_CHANNEL }}
          title: Tests on AMD
          slack_token: ${{ secrets.SLACK_CIFEEDBACK_BOT_TOKEN }}

  distributed:
    permissions:
      contents: read
    name: Distributed tests on AMD
    runs-on:
      group: hfc-amd-mi300-2gpu
    container:
      image: rocm/dev-ubuntu-24.04:7.2.4
      # The runner assigns the GPUs through HIP_VISIBLE_DEVICES and ROCR_VISIBLE_DEVICES in its env file
      options: --device /dev/kfd --device /dev/dri --group-add video --env-file /etc/podinfo/gha-gpu-isolation-settings --ipc=host
    defaults:
      run:
        shell: bash
    if: github.event.pull_request.draft == false
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Create Python virtual environment
        run: |
          uv venv
          uv pip install --upgrade setuptools wheel

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/rocm7.2
          uv pip install ".[dev]"

      - name: Check the ROCm build of torch
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import torch

          assert torch.version.hip, "CUDA torch got installed"
          # ROCm may report zero devices before HIP is initialized
          torch.cuda.init()
          assert torch.cuda.device_count() == 2, "Unexpected GPU isolation"
          # A dependency requiring `triton` installs the CUDA build over ROCm's `pytorch-triton-rocm`
          x = torch.arange(16, device="cuda", dtype=torch.float32)
          torch.testing.assert_close(torch.compile(lambda x: x + 1, fullgraph=True)(x), x + 1)
          PY

      - name: Run distributed tests
        run: |
          source .venv/bin/activate
          pytest -v tests/distributed/test_distributed.py

      - name: Post to Slack
        if: github.ref == 'refs/heads/main' && !cancelled()  # Check if the branch is main
        uses: ./.github/actions/post-slack
        with:
          slack_channel: ${{ env.CI_SLACK_CHANNEL }}
          title: Distributed tests on AMD
          slack_token: ${{ secrets.SLACK_CIFEEDBACK_BOT_TOKEN }}
