name: Tests

on:
  push:
    branches:
      - main
      - ci-*
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests.yml"
      - ".github/actions/**"
      - "Makefile"
      - "examples/**.py"
      - "tests/**"
      - "trl/**"
      - "pyproject.toml"
      # Exclude if only experimental code/tests
      - "!trl/experimental/**"
      - "!tests/experimental/**"
  pull_request:
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests.yml"
      - ".github/actions/**"
      - "Makefile"
      - "examples/**.py"
      - "tests/**"
      - "trl/**"
      - "pyproject.toml"
      # Exclude if only experimental code/tests
      - "!trl/experimental/**"
      - "!tests/experimental/**"
  workflow_dispatch:

env:
  TQDM_DISABLE: 1
  CI_SLACK_CHANNEL: ${{ secrets.CI_PUSH_MAIN_CHANNEL }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  diag_dpo_lm_head:
    permissions:
      contents: read
    name: DPO lm_head parity, min versions (${{ matrix.mode }})
    runs-on:
      group: aws-g6e-4xlarge
    container:
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      options: --gpus all
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: old-isolated
            ref: c2196d5f571ee8bb32fbfa14464f3b6854ac13d2
          - mode: old-gw9-sequence
            ref: c2196d5f571ee8bb32fbfa14464f3b6854ac13d2
          - mode: head-full-suite
            ref: ""
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ matrix.ref }}

      - name: Checkout helper files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: helper

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Create Python virtual environment
        run: |
          uv venv
          uv pip install --upgrade setuptools wheel

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install \
            ".[dev]" \
            "accelerate==1.4.0" \
            "datasets==4.7.0" \
            "transformers==4.56.2"
          uv pip freeze | grep -iE "^(torch|transformers|accelerate|datasets|liger-kernel|peft|kernels)=="
          git log --oneline -1

      - name: Old commit, parity tests alone
        if: matrix.mode == 'old-isolated'
        run: |
          source .venv/bin/activate
          pytest -s -v -p no:cacheprovider \
            "tests/test_dpo_trainer.py::TestDPOTrainer::test_liger_loss_types_match_non_liger_loss" \
            "tests/test_dpo_trainer.py::TestDPOTrainer::test_liger_f_divergence_matches_non_liger_loss"

      - name: Old commit, gw9 sequence in one process
        if: matrix.mode == 'old-gw9-sequence'
        run: |
          source .venv/bin/activate
          mapfile -t TESTS < helper/tests/_gw9_sequence.txt
          pytest -s -v -p no:cacheprovider -p no:randomly "${TESTS[@]}"

      - name: Head, full suite as in CI
        if: matrix.mode == 'head-full-suite'
        run: |
          source .venv/bin/activate
          make test
