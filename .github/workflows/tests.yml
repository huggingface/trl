name: Tests

on:
  push:
    branches:
      - main
      - ci-*
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests.yml"
      - ".github/actions/**"
      - "Makefile"
      - "examples/**.py"
      - "tests/**"
      - "trl/**"
      - "pyproject.toml"
      # Exclude if only experimental code/tests
      - "!trl/experimental/**"
      - "!tests/experimental/**"
  pull_request:
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests.yml"
      - ".github/actions/**"
      - "Makefile"
      - "examples/**.py"
      - "tests/**"
      - "trl/**"
      - "pyproject.toml"
      # Exclude if only experimental code/tests
      - "!trl/experimental/**"
      - "!tests/experimental/**"
  workflow_dispatch:

env:
  TQDM_DISABLE: 1
  CI_SLACK_CHANNEL: ${{ secrets.CI_PUSH_MAIN_CHANNEL }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  diag_grpo_chunked:
    permissions:
      contents: read
    name: GRPO chunked parity (${{ matrix.mode }})
    runs-on:
      group: aws-g6e-4xlarge
    container:
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      options: --gpus all
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: main-alone-min
            ref: 7da90a08559abbf4e84cb551157ae12f4e4e619f
            deps: min
            first: ""
          - mode: main-pair-min
            ref: 7da90a08559abbf4e84cb551157ae12f4e4e619f
            deps: min
            first: "tests/test_grpo_trainer.py::TestGRPOTrainer::test_train_loss_types[vespo-True]"
          - mode: main-pair-latest
            ref: 7da90a08559abbf4e84cb551157ae12f4e4e619f
            deps: latest
            first: "tests/test_grpo_trainer.py::TestGRPOTrainer::test_train_loss_types[vespo-True]"
          - mode: a98-pair-min
            ref: a98fa6a4428f9aae58dfb26d729d7437f662f27a
            deps: min
            first: "tests/test_grpo_trainer.py::TestGRPOTrainer::test_train_loss_types[vespo-True]"
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Create Python virtual environment
        run: |
          uv venv
          uv pip install --upgrade setuptools wheel

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          if [ "${{ matrix.deps }}" = "min" ]; then
            uv pip install ".[dev]" "accelerate==1.4.0" "datasets==4.7.0" "transformers==4.56.2"
          else
            uv pip install ".[dev]"
          fi
          uv pip freeze | grep -iE "^(torch|transformers|accelerate|datasets|liger-kernel|peft|kernels)=="

      - name: Run in one process
        run: |
          source .venv/bin/activate
          set -f  # keep the [param] test ids from being glob-expanded
          pytest -s -v -p no:cacheprovider -p no:randomly ${{ matrix.first }} "tests/test_grpo_trainer.py::TestGRPOTrainer::test_chunked_logps_match_full_logits"
