name: Tests

on:
  push:
    branches:
      - main
      - ci-*
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests.yml"
      - ".github/actions/**"
      - "Makefile"
      - "examples/**.py"
      - "tests/**"
      - "trl/**"
      - "pyproject.toml"
      # Exclude if only experimental code/tests
      - "!trl/experimental/**"
      - "!tests/experimental/**"
  pull_request:
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests.yml"
      - ".github/actions/**"
      - "Makefile"
      - "examples/**.py"
      - "tests/**"
      - "trl/**"
      - "pyproject.toml"
      # Exclude if only experimental code/tests
      - "!trl/experimental/**"
      - "!tests/experimental/**"
  workflow_dispatch:

env:
  TQDM_DISABLE: 1
  CI_SLACK_CHANNEL: ${{ secrets.CI_PUSH_MAIN_CHANNEL }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  diag_dpo_lm_head:
    permissions:
      contents: read
    name: DPO lm_head parity (transformers ${{ matrix.transformers }}, accelerate ${{ matrix.accelerate }})
    runs-on:
      group: aws-g6e-4xlarge
    container:
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      options: --gpus all
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        transformers: ["4.56.2", "5.17.0"]
        accelerate: ["1.4.0", "1.15.0"]
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Create Python virtual environment
        run: |
          uv venv
          uv pip install --upgrade setuptools wheel

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install \
            ".[dev]" \
            "accelerate==${{ matrix.accelerate }}" \
            "datasets==4.7.0" \
            "transformers==${{ matrix.transformers }}"
          uv pip freeze | grep -iE "^(torch|transformers|accelerate|datasets|liger-kernel|peft)=="

      - name: Parity tests at 5e-4
        run: |
          source .venv/bin/activate
          pytest -s -v -p no:cacheprovider \
            "tests/test_dpo_trainer.py::TestDPOTrainer::test_liger_loss_matches_non_liger_loss" \
            "tests/test_dpo_trainer.py::TestDPOTrainer::test_liger_f_divergence_matches_non_liger_loss" \
            "tests/test_kto_trainer.py::TestKTOTrainer::test_liger_loss_matches_non_liger_loss"

      - name: Diagnostic
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          python tests/_diag_dpo_lm_head_parity.py
