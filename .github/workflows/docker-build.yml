name: Build TRL Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "TRL version to build, for example 1.10.0"
        required: true

concurrency:
  group: docker-image-builds
  cancel-in-progress: false

env:
  CI_SLACK_CHANNEL: ${{ secrets.CI_PUSH_MAIN_CHANNEL }}

jobs:
  trl:
    name: "Build and push TRL Docker image"
    runs-on:
      group: aws-general-8-plus
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Get TRL version
        env:
          TAG: ${{ inputs.version || github.event.release.tag_name }}
        run: echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: docker/trl
          build-args: |
            VERSION=${{ env.VERSION }}
          push: true
          tags: |
            huggingface/trl:${{ env.VERSION }}
            huggingface/trl

      - name: Post to Slack
        if: always()
        uses: ./.github/actions/post-slack
        with:
          slack_channel: ${{ env.CI_SLACK_CHANNEL }}
          title: Build and push TRL Docker image
          slack_token: ${{ secrets.SLACK_CIFEEDBACK_BOT_TOKEN }}
