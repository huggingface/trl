name: Tests (experimental)

on:
  push:
    branches:
      - main
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests-experimental.yml"
      - ".github/actions/**"
      - "Makefile"
      - "trl/experimental/**"
      - "tests/experimental/**"
      - "pyproject.toml"
  pull_request:
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests-experimental.yml"
      - ".github/actions/**"
      - "Makefile"
      - "trl/experimental/**"
      - "tests/experimental/**"
      - "pyproject.toml"
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2am UTC

env:
  TQDM_DISABLE: 1
  CI_SLACK_CHANNEL: ${{ secrets.CI_PUSH_MAIN_CHANNEL }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"
  TRL_EXPERIMENTAL_SILENCE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    permissions:
      contents: read
    name: Tests (experimental)
    runs-on:
      group: aws-g6e-4xlarge
    container:
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      options: --gpus all
    defaults:
      run:
        shell: bash
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Create Python virtual environment
        run: |
          uv venv
          uv pip install --upgrade setuptools wheel

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install ".[dev]"

      - name: Test with pytest
        run: |
          source .venv/bin/activate
          make test_experimental

      - name: Test OpenEnv harness with pytest
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          # Separate step: openenv's gradio dependency caps pillow, so it is not installed for the tests above
          uv pip install openenv
          # harbor_env.harness is not in the openenv wheel: check out the tag of the installed version
          OPENENV_VERSION=$(python -c "import importlib.metadata; print(importlib.metadata.version('openenv'))")
          git clone --depth 1 --branch "v$OPENENV_VERSION" https://github.com/openenv/OpenEnv.git "$RUNNER_TEMP/OpenEnv"
          PYTHONPATH="$RUNNER_TEMP/OpenEnv/envs" pytest -v tests/experimental/test_openenv_tito.py

      - name: Post to Slack
        if: github.ref == 'refs/heads/main' && !cancelled()  # Check if the branch is main
        uses: ./.github/actions/post-slack
        with:
          slack_channel: ${{ env.CI_SLACK_CHANNEL }}
          title: Tests (experimental)
          slack_token: ${{ secrets.SLACK_CIFEEDBACK_BOT_TOKEN }}
