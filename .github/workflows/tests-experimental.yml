name: Tests (experimental)

on:
  pull_request:
    paths:
      # Run only when relevant files are modified
      - ".github/workflows/tests-experimental.yml"
      - "trl/experimental/**"
      - "tests/experimental/**"
      - "examples/async_grpo_harbor/**"

env:
  TQDM_DISABLE: 1
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"
  TRL_EXPERIMENTAL_SILENCE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  openenv_contract:
    permissions:
      contents: read
    name: OpenEnv capture contract (CPU)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: temp/openenv/envs
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: huggingface/OpenEnv
          ref: 34825a772ae54760fb6bf7a8b2073a4a85714004
          path: temp/openenv
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Install CPU test dependencies
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install ".[test]" ./temp/openenv
      - name: Check pinned producer and consumer
        run: |
          source .venv/bin/activate
          python -c "import harbor_env.harness; import trl.experimental.async_grpo.openenv_harness"
          python -m pytest -q tests/experimental/test_openenv_tito.py tests/experimental/test_harbor_example.py \
            tests/experimental/test_async_grpo_trainer.py::TestReconciler tests/test_vllm_control_requests.py

  tests:
    permissions:
      contents: read
    name: Tests (experimental)
    runs-on:
      group: aws-g6e-4xlarge
    container:
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      options: --gpus all
    defaults:
      run:
        shell: bash
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Create Python virtual environment
        run: |
          uv venv
          uv pip install --upgrade setuptools wheel

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install ".[dev]"

      - name: Test with pytest
        run: |
          source .venv/bin/activate
          make test_experimental
