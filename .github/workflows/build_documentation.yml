name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

env:
  TRL_EXPERIMENTAL_SILENCE: 1

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@9fc8a41d7729c424fdb2192f2f85ff63102ec9a3  # main
    with:
      commit_sha: ${{ github.sha }}
      package: trl
      version_tag_suffix: ""
      python_version: "3.12"
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
