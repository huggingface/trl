name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

env:
  TRL_EXPERIMENTAL_SILENCE: 1

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@1a5ffe7ee75754c27c7bbd650ac124affa660d3d  # main
    with:
      commit_sha: ${{ github.sha }}
      package: trl
      version_tag_suffix: ""
      python_version: "3.13"
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
