name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

env:
  TRL_EXPERIMENTAL_SILENCE: 1

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@ecdecfb9b66123f9078fa5ec62296cba6fdc971b  # v0.6.0
    with:
      commit_sha: ${{ github.sha }}
      package: trl
      version_tag_suffix: ""
      python_version: "3.13"
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
