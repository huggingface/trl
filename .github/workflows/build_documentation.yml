name: Build documentation

on:
  push:
    branches:
      - main
      - doc-builder*
      - v*-release

env:
  TRL_EXPERIMENTAL_SILENCE: 1

jobs:
   build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@63ec6f1a0ac9300e6a35f4efe140b09ac9f68a89  # main
    with:
      commit_sha: ${{ github.sha }}
      package: trl
      version_tag_suffix: ""
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
