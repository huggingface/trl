name: Build TRL dev Docker image

on:
  push:
    branches:
      - main
      - ci-docker-python-3.13
      - ci-docker-uv-python
  workflow_dispatch:

concurrency:
  group: docker-image-build-dev
  cancel-in-progress: false

env:
  CI_SLACK_CHANNEL: ${{ secrets.CI_PUSH_MAIN_CHANNEL }}

permissions: {}

jobs:
  trl-dev:
    permissions:
      contents: read
    name: "Build and push TRL Dev Docker image"
    runs-on:
      group: aws-general-8-plus
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: docker/trl-dev
          push: false
          load: true
          tags: |
            trl-dev-verify

      - name: Assert the imports work and the Python version is 3.13
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python trl-dev-verify -c "import trl, torch, vllm, liger_kernel, peft, kernels, trackio; print(trl.__version__, torch.__version__, vllm.__version__)"
          PYTHON=$(docker run --rm --entrypoint python trl-dev-verify -c "import sys; print('%d.%d' % sys.version_info[:2])" | tail -n1)
          echo "python=${PYTHON}"
          test "${PYTHON}" = "3.13"
