name: Tests latest TRL release with dev dependencies

on:
  workflow_dispatch:

env:
  TQDM_DISABLE: 1
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"

permissions: {}

jobs:
  debug_cb:
    permissions:
      contents: read
    name: Debug CB (transformers ${{ matrix.transformers }}, ${{ matrix.shard }})
    runs-on:
      group: aws-g6e-4xlarge
    container:
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      options: --gpus all
    strategy:
      fail-fast: false
      matrix:
        transformers: [main]
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Create Python virtual environment
        run: |
          uv venv
          uv pip install --upgrade setuptools wheel

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install ".[dev]"
          if [ "${{ matrix.transformers }}" = main ]; then
            uv pip install "transformers @ git+https://github.com/huggingface/transformers.git"
          fi
          nvidia-smi
          python -c "import torch, transformers; print(torch.__version__, transformers.__version__, torch.cuda.get_device_name())"

      - name: GRPO + RLOO test files with xdist and the CB trace, 12 times
        timeout-minutes: 100
        continue-on-error: true
        env:
          CB_TRACE: "1"
        run: |
          set +e
          source .venv/bin/activate
          mkdir -p logs
          for i in $(seq 1 12); do
            timeout 900 pytest -n auto --dist loadgroup -s -v -rA tests/test_grpo_trainer.py tests/test_rloo_trainer.py \
              > logs/trace-$i.log 2>&1
            echo "trace $i: exit=$? asserts=$(grep -c 'srcIndex <' logs/trace-$i.log) dumps=$(grep -c 'CB_TRACE DUMP' logs/trace-$i.log)"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: logs-${{ matrix.transformers }}-${{ matrix.shard }}
          path: logs/
