name: Tests latest TRL release with dev dependencies

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC

  workflow_dispatch:

env:
  TQDM_DISABLE: 1
  CI_SLACK_CHANNEL: ${{ secrets.CI_PUSH_MAIN_CHANNEL }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TRL_EXPERIMENTAL_SILENCE: 1

jobs:
  tests:
    name: Tests latest TRL release with dev dependencies
    runs-on:
      # TODO: move to aws-g6e-4xlarge (L40S) once v1.11 ships; v1.10-release predates the flash-attn2 xfails and
      # would fail on Ada hardware
      group: aws-g4dn-2xlarge
    container:
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      options: --gpus all
    defaults:
      run:
        shell: bash
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { ref: v1.11-release }

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Create Python virtual environment
        run: |
          uv venv
          uv pip install --upgrade setuptools wheel

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install -U \
            ".[dev]" \
            "accelerate @ git+https://github.com/huggingface/accelerate.git" \
            "datasets @ git+https://github.com/huggingface/datasets.git" \
            "transformers @ git+https://github.com/huggingface/transformers.git"

      - name: Test with pytest
        run: |
          source .venv/bin/activate
          make test

      # This job checks out the release branch, which predates the local Slack action, so check
      # the action out from the branch running the workflow. Keep this step on `always()`: it must
      # never be skipped while the Slack step below runs, or the action cannot be resolved.
      - name: Check out the Slack action
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: slack-action
          sparse-checkout: .github/actions

      - name: Post to Slack
        if: always()
        uses: ./slack-action/.github/actions/post-slack
        with:
          slack_channel: ${{ env.CI_SLACK_CHANNEL }}
          title: Tests latest TRL release with dev dependencies
          slack_token: ${{ secrets.SLACK_CIFEEDBACK_BOT_TOKEN }}
