name: Labeler

on:
  # pull_request_target: the token on a forked `pull_request` run cannot write labels.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      # The config is read from the base branch, so a pull request cannot relabel itself.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          # Drop the label again when a docs-only pull request grows a code change.
          sync-labels: true
