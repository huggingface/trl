name: Debug torch 2.6 ordered replay

on:
  push:
    branches:
      - debug-torch26-*

env:
  TQDM_DISABLE: 1
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"

jobs:
  replay:
    permissions:
      contents: read
    name: Replay ${{ matrix.seq }} (${{ matrix.variant }}, ${{ matrix.shard }})
    runs-on:
      group: aws-g6e-4xlarge
    container:
      image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-devel
      options: --gpus all
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        seq: [gw8]
        variant: [baseline, cudnn-off, cudnn-9.5]
        shard: [1, 2]
    steps:
      - name: Git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Make and Git
        run: |
          apt-get update && apt-get install -y make git curl

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Create Python virtual environment
        run: |
          uv venv
          uv pip install --upgrade setuptools wheel

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv pip install \
            ".[dev]" \
            "accelerate==1.4.0" \
            "datasets==4.7.0" \
            "torch==2.6.0" \
            "transformers==4.56.2"
          if [ "${{ matrix.variant }}" = "cudnn-9.5" ]; then uv pip install --no-deps "nvidia-cudnn-cu12==9.5.1.17"; fi
          uv pip list | grep -iE "^(torch|nvidia-cudnn-cu12|nvidia-cuda-nvrtc-cu12) "

      - name: Replay ordered tests in one process
        run: |
          source .venv/bin/activate
          nvidia-smi --query-gpu=name,driver_version --format=csv
          if [ "${{ matrix.variant }}" = "cudnn-off" ]; then export DISABLE_CUDNN=1; fi
          python -c "import torch; print('cudnn', torch.backends.cudnn.version())"
          fails=0
          for i in 1 2 3 4 5; do
            echo "### iteration $i" >> /tmp/state.txt
            if STATE_LOG=/tmp/state.txt PYTHONPATH=.github/debug python -m pytest -p stateplug -p no:cacheprovider -q -rf \
                $(cat .github/debug/prefix_${{ matrix.seq }}.txt) > /tmp/iter_$i.txt 2>&1; then
              echo "iteration $i: PASS $(tail -1 /tmp/iter_$i.txt)"
            else
              fails=$((fails + 1)); echo "iteration $i: FAIL $(tail -1 /tmp/iter_$i.txt)"; grep -E '^FAILED' /tmp/iter_$i.txt
            fi
          done
          echo "RESULT ${{ matrix.variant }} shard ${{ matrix.shard }}: $fails/5 failed"

      - name: Report per-test state
        if: always()
        run: |
          grep -c '^CHANGED' /tmp/state.txt || true
          cat /tmp/state.txt || echo "no state log"
