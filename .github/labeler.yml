# Labels derived from the changed paths alone; ✨ enhancement, 🐛 bug and 💥 breaking stay manual.
# `any-glob-to-all-files` means "one glob matches every changed file", so the maintenance paths are
# a single braced glob: listed separately, a pull request spanning two of them would get no label.

"📚 documentation":
  - changed-files:
      - any-glob-to-all-files:
          - "docs/**"

"🔧 maintenance":
  - changed-files:
      - any-glob-to-all-files:
          - "{.github/**,docker/**,scripts/**,tests/**,.pre-commit-config.yaml,.gitignore,Makefile,MANIFEST.in,pyproject.toml,RELEASE.md}"
