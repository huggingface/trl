# Labels derived from the changed paths alone; ✨ enhancement, 🐛 bug and 💥 breaking stay manual.
# `any-glob-to-all-files` requires every changed file to match, so a pull request that also touches
# trl/ gets no label and falls through to "Other" rather than into a wrong section.

"📚 documentation":
  - changed-files:
      - any-glob-to-all-files:
          - "docs/**"

"🔧 maintenance":
  - changed-files:
      - any-glob-to-all-files:
          - ".github/**"
          - "docker/**"
          - "scripts/**"
          - "tests/**"
          - ".pre-commit-config.yaml"
          - ".gitignore"
          - "Makefile"
          - "MANIFEST.in"
          - "pyproject.toml"
          - "RELEASE.md"
